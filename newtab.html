<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="stylesheet" href="glass.css">
  <link rel="stylesheet" href="wallpaper.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="widgets">
    <div id="clock" class="widget glass thin">
      <time id="clock-time" class="clock-time"></time>
      <span id="clock-sub" class="widget-sub"></span>
    </div>
    <div class="widgets-end">
      <div id="meeting" class="widget glass thin" aria-live="polite" hidden></div>
      <button id="tasks-toggle" class="glass thin glass-button round" type="button" aria-label="Tasks" aria-controls="tasks" aria-expanded="false" aria-keyshortcuts="Alt+T" title="Tasks (⌥T)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 2 2 3.5-3.5M4 15l2 2 3.5-3.5M13 8h7M13 16h7"/></svg>
      </button>
      <button id="import-history" class="glass thin glass-button round" type="button" aria-label="Add bookmarks from history" title="Add from history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5"/><path d="M12 7.5V12l3 2"/></svg>
      </button>
    </div>
  </div>
  <label class="search glass thin">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search" autocomplete="off" aria-label="Search bookmarks">
  </label>
  <nav id="frequent" class="frequent glass thin" aria-label="Frequent sites" hidden></nav>
  <button id="web-search" class="glass thin glass-button pill web-search" type="button" title="Shift+Enter" hidden></button>
  <main id="pager" class="pager">
    <div class="track"></div>
    <p id="empty" hidden>No bookmarks found</p>
  </main>
  <nav id="dots" class="dots glass thin" aria-label="Pages"></nav>
  <!-- The Dock: bookmarks kept in the "Dock" folder (inside Other bookmarks), always on screen -->
  <div id="dock" class="pager dock glass thin" aria-label="Dock" aria-keyshortcuts="Alt+D"><div class="track"></div></div>
  <nav id="dock-dots" hidden></nav>
  <button id="add" class="glass thin glass-button round add" aria-label="Add bookmark" title="Add bookmark">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button id="settings" class="glass thin glass-button round" aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>

  <dialog id="drawer" class="glass regular">
    <header>
      <div class="drawer-side">
        <button id="back" class="glass thin glass-button round" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button id="folder-add" class="glass thin glass-button round add" aria-label="Add bookmark to this folder" title="Add bookmark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <input id="drawer-title" aria-label="Folder name" maxlength="255" spellcheck="false" autocomplete="off">
      <div class="drawer-side end">
        <button id="open-all" class="glass thin glass-button pill" type="button">Open all</button>
      </div>
    </header>
    <div id="folder-pager" class="pager"><div class="track"></div></div>
    <nav id="folder-dots" class="dots" aria-label="Folder pages"></nav>
  </dialog>

  <!-- Tasks: a to-do list in a panel on the right -->
  <aside id="tasks" class="glass regular" aria-labelledby="tasks-heading" hidden>
    <header class="tasks-head">
      <h2 id="tasks-heading">Tasks</h2>
      <span id="tasks-count" class="tasks-count"></span>
      <button id="tasks-close" class="glass thin glass-button round" type="button" aria-label="Hide tasks">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <form id="tasks-form" class="search glass thin tasks-add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <input id="tasks-new" placeholder="Add a task" maxlength="200" autocomplete="off" spellcheck="false" aria-label="New task">
    </form>
    <ul id="tasks-list" class="tasks-list" aria-label="Your tasks"></ul>
    <button id="tasks-clear" class="glass thin glass-button pill" type="button" hidden>Clear completed</button>
  </aside>

  <!-- Add / edit a bookmark, rename a folder -->
  <template id="upload-glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4-4-9 9M17 3v6M14 6h6"/></svg></template>
  <dialog id="editor" class="glass regular" aria-labelledby="editor-heading">
    <form id="editor-form" novalidate>
      <h2 id="editor-heading"></h2>
      <label class="field"><span>Name</span><input id="editor-name" maxlength="255" autocomplete="off" spellcheck="false"></label>
      <label class="field" id="editor-url-field"><span>Address</span><input id="editor-url" inputmode="url" maxlength="2048" placeholder="example.com" autocomplete="off" spellcheck="false"></label>
      <div class="field" id="editor-icon-field">
        <span>Icon</span>
        <div class="icon-picker">
          <div id="editor-icon" class="icon"></div>
          <input id="editor-emoji" class="emoji-input" maxlength="16" placeholder="🙂" autocomplete="off" spellcheck="false" aria-label="Emoji" title="Type or paste an emoji (⌃⌘Space)">
          <label class="glass thin glass-button pill" title="Or paste or drop an image here">Upload image…<input id="editor-icon-file" type="file" accept="image/*" hidden></label>
          <button id="editor-icon-reset" type="button" class="glass thin glass-button pill" hidden>Reset</button>
        </div>
        <div id="icon-choices" class="icon-choices" role="listbox" aria-label="Choose an icon"></div>
      </div>
      <p id="editor-error" class="error" role="alert" hidden></p>
      <div class="buttons">
        <button id="editor-cancel" type="button" class="glass thin glass-button pill">Cancel</button>
        <button type="submit" class="glass-button pill primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Add bookmarks from browsing history -->
  <dialog id="importer" class="glass regular" aria-labelledby="importer-heading">
    <header class="importer-head">
      <h2 id="importer-heading">Add from history</h2>
      <button id="importer-close" class="glass thin glass-button round" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <label class="search glass thin importer-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="importer-query" type="search" placeholder="Search your history" autocomplete="off" spellcheck="false" aria-label="Search your history">
    </label>
    <div id="importer-list" class="importer-list" role="group" aria-label="Pages from your history"></div>
    <p id="importer-note" class="importer-note" role="status" hidden></p>
    <footer class="importer-foot">
      <label class="importer-dest">Add to <span class="select"><select id="importer-folder"></select></span></label>
      <input id="importer-new-folder" class="importer-name" placeholder="New folder name" maxlength="255" autocomplete="off" aria-label="New folder name" hidden>
      <span class="spacer"></span>
      <button id="importer-add" class="glass-button pill primary" type="button" disabled>Add</button>
    </footer>
  </dialog>

  <!-- Right-click menu on a tile or empty space -->
  <div id="menu" class="glass thick menu" popover role="menu"></div>

  <!-- "Deleted … Undo" after removing a bookmark or folder -->
  <div id="toast" class="glass thick toast" popover="manual" role="status">
    <span></span>
    <button type="button" class="glass-button pill primary">Undo</button>
  </div>

  <script src="settings.js"></script>
  <script src="drive-sync.js"></script>
  <script src="app.js"></script>
  <script src="widgets.js"></script>
  <script src="history-import.js"></script>
  <script src="tasks.js"></script>
  <script src="dev-reload.js"></script>
</body>
</html>
